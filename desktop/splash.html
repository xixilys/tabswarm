<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Web AI Hub</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, rgba(14, 165, 233, 0.14), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.16), transparent 50%),
                  #0b101b;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    .card {
      width: 460px;
      max-width: 90vw;
      padding: 28px;
      border-radius: 16px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #0f172a;
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      font: 700 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #38bdf8;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .actions {
      margin-top: 20px;
      display: none;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .actions.visible { display: flex; }
    button {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">&gt;_</div>
    <h1>Web AI Hub · 网页 AI 控制台</h1>
    <p id="status">正在连接本地服务 127.0.0.1:8782…</p>
    <div id="actions" class="actions">
      <button id="btn-start" class="primary">启动 / 重试本地服务</button>
      <button id="btn-logs">打开日志目录</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const statusEl = document.getElementById('status');
    const actionsEl = document.getElementById('actions');
    if (params.get('offline') === '1') {
      statusEl.textContent = params.get('msg') || '本地 MCP 服务尚未响应（127.0.0.1:8782），可点击下方按钮自动拉起并重连。';
      actionsEl.classList.add('visible');
    }
    document.getElementById('btn-start').addEventListener('click', async () => {
      statusEl.textContent = '正在启动本地服务并重连…';
      await window.webhubDesktop?.startAndReconnect?.();
    });
    document.getElementById('btn-logs').addEventListener('click', () => {
      window.webhubDesktop?.openLogs?.();
    });
  </script>
</body>
</html>
