<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Web AI Hub</title>
<style>
  :root { color-scheme: dark; --bg:#0b101b; --bar:#111827; --line:#1f2937; --fg:#e5e7eb; --mut:#9ca3af; --acc:#60a5fa; --ok:#34d399; --warn:#fbbf24; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; overflow:hidden; }
  #bar { height:44px; box-sizing:border-box; display:flex; align-items:center; gap:4px; padding:0 8px; background:var(--bar); border-bottom:1px solid var(--line); -webkit-user-select:none; user-select:none; }
  #tabs { display:flex; gap:4px; overflow-x:auto; flex:1; min-width:0; scrollbar-width:none; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { display:flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:7px; cursor:pointer; white-space:nowrap; max-width:240px; color:var(--mut); border:1px solid transparent; }
  .tab:hover { background:#1a2333; color:var(--fg); }
  .tab.sel { background:#1e293b; color:var(--fg); border-color:#334155; }
  .tab .t { overflow:hidden; text-overflow:ellipsis; }
  .tab .x { opacity:.5; padding:0 2px; border-radius:4px; }
  .tab .x:hover { opacity:1; background:#334155; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--mut); flex:none; }
  .dot.chatgpt { background:var(--ok); } .dot.gemini { background:var(--acc); } .dot.task { box-shadow:0 0 0 2px #fbbf2455; }
  .acct { font-size:11px; color:var(--mut); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .btn { height:28px; padding:0 10px; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; font:inherit; }
  .btn:hover { background:#1a2333; }
  select.btn { padding:0 6px; }
  #hint { color:var(--warn); font-size:12px; padding:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <span id="hint"></span>
  <select id="acct" class="btn" title="在哪个账号的内嵌页里打开"></select>
  <button class="btn" id="openGpt" title="在内嵌页打开 ChatGPT（首次在这里登录）">＋ ChatGPT</button>
  <button class="btn" id="openGem" title="在内嵌页打开 Gemini（首次在这里登录）">＋ Gemini</button>
</div>
<script>
const api = window.webhubShell;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
let st = { selected: 'dashboard', tabs: [], accounts: ['default'] };
function label(t) {
  if (t.kind === 'task' && t.task_id) return `任务 ${t.task_id}`;
  const name = t.site === 'chatgpt' ? 'ChatGPT' : t.site === 'gemini' ? 'Gemini' : '';
  return (t.title && !/^(ChatGPT|Gemini|Google Gemini)$/.test(t.title) ? t.title : name) || t.url || '新标签';
}
function render() {
  const tabs = [`<div class="tab ${st.selected === 'dashboard' ? 'sel' : ''}" data-id="dashboard"><span class="dot"></span><span class="t">控制台</span></div>`];
  for (const t of st.tabs) {
    tabs.push(`<div class="tab ${t.selected ? 'sel' : ''}" data-id="${esc(t.id)}" title="${esc(t.url)}"><span class="dot ${esc(t.site)} ${t.kind === 'task' ? 'task' : ''}"></span>${t.account !== 'default' ? `<span class="acct">${esc(t.account)}</span>` : ''}<span class="t">${esc(label(t))}</span><span class="x" data-close="${esc(t.id)}" title="关闭">×</span></div>`);
  }
  $('#tabs').innerHTML = tabs.join('');
  const sel = $('#acct'); const cur = sel.value || 'default';
  sel.innerHTML = (st.accounts.length ? st.accounts : ['default']).map((a) => `<option ${a === cur ? 'selected' : ''}>${esc(a)}</option>`).join('');
  sel.style.display = st.accounts.length > 1 ? '' : 'none';
  const tasks = st.tabs.filter((t) => t.kind === 'task').length;
  $('#hint').textContent = st.notice || (tasks ? `${tasks} 个任务在后台运行` : '');
  $('#hint').title = st.notice || '';
}
$('#tabs').addEventListener('click', (e) => {
  const x = e.target.closest('[data-close]');
  if (x) { e.stopPropagation(); api.close(x.dataset.close); return; }
  const t = e.target.closest('.tab'); if (t) api.select(t.dataset.id);
});
$('#openGpt').onclick = () => api.open('chatgpt', $('#acct').value || 'default');
$('#openGem').onclick = () => api.open('gemini', $('#acct').value || 'default');
api.onState((s) => { st = { ...st, ...s }; render(); });
api.state().then((s) => { st = { ...st, ...s }; render(); });
render();
</script>
</body>
</html>
