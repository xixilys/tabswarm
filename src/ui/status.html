<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>网页 AI 控制台</title>
<link rel="icon" href="data:,">
<style>
:root,[data-theme=dark]{
  color-scheme:dark;
  --bg:#0b0f17;--panel:#121826;--hover:#192234;--sunk:#0e131d;--line:#222b3d;--line2:#2c3750;
  --fg:#e6e9f0;--mut:#8e97aa;--dim:#5f687c;
  --acc:#6e9bff;--accfg:#0b1430;--ok:#4fd08a;--bad:#ff6b81;--warn:#f0b35a;--run:#5cc8ff;--gem:#8ab4ff;--gpt:#4fd0a0;
  --add:#15301f;--addfg:#9ee6b0;--del:#3a1a22;--delfg:#ffb3c0;--hunk:#5cc8ff;
  --term:#080b11;--termfg:#d6dae3;--shadow:0 10px 30px #0008;
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f5f6f8;--panel:#ffffff;--hover:#eef1f6;--sunk:#f0f2f5;--line:#e2e6ec;--line2:#d3d9e2;
  --fg:#161a22;--mut:#5b6372;--dim:#98a0ad;
  --acc:#2f6bff;--accfg:#ffffff;--ok:#16a34a;--bad:#dc2645;--warn:#b7791f;--run:#0284c7;--gem:#2f6bff;--gpt:#0f9f6e;
  --add:#e6f6ea;--addfg:#1b5e20;--del:#fdecef;--delfg:#b71c1c;--hunk:#0277bd;
  --term:#1b1f27;--termfg:#e8eaee;--shadow:0 10px 30px #1a223333;
}
:root{--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
code,.mono{font-family:var(--mono);font-size:12px}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.top{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:9px;flex:none;margin-right:4px}
.brand .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--gpt));display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:-.5px}
.brand h1{font-size:14.5px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.quotas{display:flex;gap:6px;min-width:0;overflow:hidden;flex:0 1 auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--mut);font-size:12px;white-space:nowrap;flex:none}
.pill b{color:var(--fg);font-weight:600}
.pill.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.pill.click{cursor:pointer}.pill.click:hover{background:var(--hover)}
.spacer{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:0 11px;font-size:12.5px;cursor:pointer;font-weight:550;white-space:nowrap;flex:none}
.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:7px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.btn.primary:hover{filter:brightness(1.08);background:var(--acc)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}.btn.ghost:hover{color:var(--fg);background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.menu-wrap{position:relative;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:30}
.menu.open{display:block}
.menu .mi{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;text-align:left}
.menu .mi:hover{background:var(--hover)}
.menu .msep{height:1px;background:var(--line);margin:5px 4px}
.menu .mlabel{font-size:11px;color:var(--dim);padding:4px 10px 2px}
.select,.input,textarea.input{border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;height:30px;padding:0 10px;font-size:12.5px;min-width:0;transition:border-color .12s}
.select{appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.select:focus,.input:focus,textarea.input:focus{outline:none;border-color:color-mix(in srgb,var(--acc) 65%,var(--line));box-shadow:none}
textarea.input{height:auto;padding:10px 12px;line-height:1.55;resize:vertical;font-size:13.5px}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:304px minmax(0,1fr);height:calc(100% - 52px)}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--panel)}
.nav{flex:none;display:flex;flex-direction:column;gap:2px;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:9px;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:13px;font-weight:550;text-align:left;width:100%}
.nv:hover{background:var(--hover);color:var(--fg)}
.nv.act{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--fg)}
.nv .ic{width:18px;text-align:center;flex:none}
.nv .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .ct{font-size:11px;color:var(--mut);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px}
.nv .ct.live{color:var(--run);border-color:color-mix(in srgb,var(--run) 45%,var(--line))}
.side-tools{flex:none;padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.side-tools .input{width:100%;height:30px}
.fpills{display:flex;gap:4px;flex-wrap:wrap}
.fp{border:1px solid var(--line);background:transparent;color:var(--mut);height:24px;padding:0 9px;border-radius:999px;font-size:12px;cursor:pointer}
.fp:hover{color:var(--fg);background:var(--hover)}
.fp.act{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chk{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);margin:0}
.tasks{flex:1;overflow:auto;min-height:0;padding:4px 6px 20px}
.ti{padding:8px 10px;border-radius:9px;cursor:pointer;min-width:0;margin:1px 0}
.ti:hover{background:var(--hover)}
.ti.sel{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.ti1{display:flex;align-items:center;gap:8px;min-width:0}
.ti1 .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.ti1 .tm{flex:none;color:var(--dim);font-size:11.5px}
.ti2{display:flex;align-items:center;gap:6px;margin:3px 0 0 16px;color:var(--mut);font-size:11.5px;min-width:0;overflow:hidden;white-space:nowrap}
.side-empty{color:var(--dim);font-size:12px;text-align:center;padding:24px 8px}
.main{overflow:auto;min-width:0;min-height:0;padding:20px 24px 80px;position:relative}
.mobile-tasks{display:none}

/* ---------- atoms ---------- */
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.dot.run{background:var(--run);box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 60%,transparent);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pulse{50%{opacity:.4}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;padding:0 7px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);color:var(--mut);white-space:nowrap;flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badge.bad{color:var(--bad)}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.run{color:var(--run)}
.badge.gem{color:var(--gem)}.badge.gpt{color:var(--gpt)}.badge.acc{color:var(--acc)}
.badge.click{cursor:pointer}.badge.click:hover{border-color:var(--line2);color:var(--fg)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--run);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.st{flex:none;font-size:12px}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.warn{color:var(--warn)}
.meta{color:var(--mut);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
pre{font-family:var(--mono);font-size:12px;line-height:1.55;margin:0;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--mut);padding:28px 0;text-align:center}
.mut{color:var(--mut)}.dim{color:var(--dim)}

/* ---------- views ---------- */
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h2{font-size:19px;margin:0;font-weight:680;letter-spacing:.2px}
.vh .sub{color:var(--mut);font-size:12.5px}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--mut);letter-spacing:.3px}
.sec .ct{font-weight:500;color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .kv{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.kpi .kv small{font-size:13px;color:var(--dim);font-weight:500}
.kpi .kl{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.live{border-color:color-mix(in srgb,var(--run) 45%,var(--line))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.cardx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cardx.live{border-color:color-mix(in srgb,var(--run) 45%,var(--line))}
.cardx.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.ch1{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.ch1 .ttl{font-weight:600;min-width:0;flex:1 1 160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.elapsed{font-family:var(--mono);font-size:12px;color:var(--fg)}
.url{font-family:var(--mono);font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pending{border:1px solid color-mix(in srgb,var(--warn) 70%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pending .ph{display:flex;gap:8px;align-items:center;font-weight:650;color:var(--warn);margin-bottom:8px}
.pending .pi{border-top:1px solid color-mix(in srgb,var(--warn) 25%,var(--line));padding:8px 0 2px;display:flex;flex-direction:column;gap:6px}
.pending .pi:first-of-type{border-top:0;padding-top:0}
.cmdbox{font-family:var(--mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 9px;white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto}
.run-list{display:flex;flex-direction:column;gap:10px}
.rcard{background:var(--panel);border:1px solid color-mix(in srgb,var(--run) 35%,var(--line));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard .rt{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.rcard .rt .ttl{font-weight:620;flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stp{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--dim);min-width:0;white-space:nowrap;overflow:hidden}
.stp i{display:block;height:3px;border-radius:3px;background:var(--line)}
.stp.done{color:var(--mut)}.stp.done i{background:color-mix(in srgb,var(--acc) 70%,var(--line))}
.stp.cur{color:var(--fg);font-weight:600}.stp.cur i{background:var(--run);animation:pulse 1.4s infinite}
.tool-now{display:flex;align-items:center;gap:8px;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px}
.tool-now .sum{font-family:var(--mono);color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tail{font-family:var(--mono);font-size:11.5px;color:var(--mut);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.idle{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.idle .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);display:grid;place-items:center;font-size:20px;flex:none}
.idle .tx{flex:1;min-width:200px}
.idle .tx b{font-size:15px;display:block;margin-bottom:2px}
.rep{cursor:pointer}
.rep:hover{border-color:var(--line2);background:var(--hover)}
.rep .rs{color:var(--mut);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
details.fold{margin-top:10px}
details.fold>summary{cursor:pointer;color:var(--mut);font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none;padding:4px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';font-size:10px;transition:transform .12s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.quiet{color:var(--dim);font-size:12.5px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}

/* composer */
.cz{max-width:880px;display:flex;flex-direction:column;gap:16px}
.cz-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.cz-row>label{color:var(--mut);font-size:12.5px;padding-top:6px}
.cz-row .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.tc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tc:hover{background:var(--hover)}
.tc.act{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--panel))}
.tc b{font-size:13.5px}
.tc span{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.sg{border:1px solid var(--line);background:var(--panel);color:var(--mut);height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--mono)}
.sg:hover{color:var(--fg);background:var(--hover)}
.sg.act{color:var(--fg);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
.sg:disabled{opacity:.4;cursor:not-allowed}
.tpl{border:1px dashed var(--line2);background:transparent;color:var(--mut);height:26px;padding:0 10px;border-radius:999px;font-size:12px;cursor:pointer}
.tpl:hover{color:var(--fg);border-style:solid;background:var(--hover)}
.cz-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--mut)}
.warnline{color:var(--warn);font-size:12px}

/* timeline (kept from the previous page) */
.feed-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.feed-bar .input{flex:1;min-width:200px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden;min-width:0}
.card .ch{display:flex;gap:8px;align-items:center;padding:7px 12px;cursor:pointer;min-width:0}
.card .ch:hover{background:var(--hover)}
.card .ch .time{color:var(--dim);font-family:var(--mono);font-size:11.5px;flex:none}
.card .ch .tool{font-weight:600;flex:none}
.card .ch .sum{color:var(--mut);font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card .ch .dur{color:var(--dim);font-size:11.5px;flex:none}
.card .cb{border-top:1px solid var(--line);padding:10px 12px;display:none;min-width:0}
.card.open .cb{display:block}
.card.denied{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.card.denied .ch .tool{color:var(--bad)}
.card.err .ch .tool{color:var(--warn)}
.term{background:var(--term);color:var(--termfg);border-radius:8px;padding:10px 12px;max-height:420px;overflow:auto}
.term .cmd{color:#7dcfff}.term .exit{color:#9aa1af;margin-top:6px}.term .exit.bad{color:#f7768e}
.diff{border-radius:8px;overflow:auto;border:1px solid var(--line);max-height:520px}
.diff div{font-family:var(--mono);font-size:12px;white-space:pre;padding:0 10px;min-height:1.45em}
.diff .a{background:var(--add);color:var(--addfg)}.diff .d{background:var(--del);color:var(--delfg)}.diff .h{color:var(--hunk);background:var(--sunk)}.diff .f{color:var(--dim)}
.label{color:var(--mut);font-size:11.5px;margin:8px 0 4px}
.reason{color:var(--bad);font-weight:560;margin-bottom:6px}
.line{display:flex;gap:8px;color:var(--mut);font-size:12.5px;padding:4px 8px;align-items:baseline;border-radius:7px;min-width:0}
.line>span:last-child{min-width:0;overflow-wrap:anywhere}
.line:hover{background:var(--panel)}
.line .time{color:var(--dim);font-family:var(--mono);font-size:11.5px;flex:none}
.line b{color:var(--fg);font-weight:560}
.report{border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--panel));border-radius:12px;padding:12px 14px;margin:10px 0;min-width:0}
.report.blocked{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--panel))}
.report.progress{border-color:var(--line);background:var(--panel)}
.report .rh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-weight:650;flex-wrap:wrap}
.report .rc{white-space:pre-wrap;word-break:break-word}
.confirm{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:10px;padding:12px 14px;margin:10px 0}
.confirm .btns,.pending .btns{display:flex;gap:8px;margin-top:8px}
.approve,.deny{border:0;border-radius:8px;height:30px;padding:0 16px;cursor:pointer;font-weight:600}
.approve{background:var(--ok);color:#06210f}.deny{background:var(--bad);color:#2a0710}

<script>
/*__GWM_BOOT__*/
const G = window.GWM || {api:'/api',readOnly:true,csrf:''};
const RO = !!(G.remote || G.readOnly);
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmmss = (iso) => { try { return new Date(iso).toLocaleTimeString('zh-CN',{hour12:false}); } catch { return ''; } };
const fmtDur = (ms) => ms == null ? '' : ms < 1000 ? ms+'毫秒' : ms < 60000 ? (ms/1000).toFixed(1)+'秒' : Math.floor(ms/60000)+'分'+String(Math.round(ms%60000/1000)).padStart(2,'0')+'秒';
function fmtElapsed(sec){
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + ' 秒';
  if (sec < 3600) return Math.floor(sec/60) + ' 分 ' + String(sec%60).padStart(2,'0') + ' 秒';
  return Math.floor(sec/3600) + ' 时 ' + String(Math.floor(sec%3600/60)).padStart(2,'0') + ' 分';
}
function relTime(iso){
  const t = Date.parse(iso || ''); if (!t) return '';
  const d = (Date.now() - t) / 1000;
  if (d < 45) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + ' 分钟前';
  const dt = new Date(t), now = new Date();
  if (dt.toDateString() === now.toDateString()) return dt.toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});
  return (dt.getMonth()+1) + '/' + dt.getDate() + ' ' + dt.toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});
}

const ICON = {list_roots:'◎',list_dir:'▤',read_file:'📄',write_file:'✎',edit_file:'✎',search:'⌕',run_command:'❯',command_output:'❯',git_status:'⎇',git_diff:'⎇',git_log:'⎇',report:'✉',agent_spawn:'🤖',agent_status:'🤖',agent_result:'🤖',agent_list:'🤖'};
const TOOL_LABEL = {
  list_roots:'查看授权目录', list_dir:'列出目录', read_file:'读取文件', write_file:'写入文件',
  edit_file:'修改文件', search:'搜索文件', run_command:'执行命令', command_output:'查看输出',
  git_status:'Git 状态', git_diff:'Git 变更', git_log:'提交记录', report:'提交汇报',
  agent_spawn:'启动本地代理', agent_status:'查看代理状态', agent_result:'读取代理结果', agent_list:'列出本地代理',
};
const STATUS_LABEL = {
  queued:'排队中', starting:'启动中', dispatched:'已发送', running:'执行中', active:'对话中',
  reported:'已汇报', done:'已完成', blocked:'受阻', failed:'失败', abandoned:'已中止',
  interrupted:'已中断', timeout:'超时', cancelled:'已取消', paused:'已暂停', stalled:'停滞',
  needs_owner:'待你拍板', limit:'达上限', error:'异常', stopped:'已停止', killed:'已强杀', lost:'已丢失',
};
const STAGE_LABEL = {
  starting:'启动中', sending:'发送指令中', generating:'AI 生成中', tool_running:'工具执行中',
  waiting_confirm:'等待网页确认', waiting:'等待响应', rate_limited:'触发限流',
  auth_required:'需要登录', stale:'状态未更新', dashboard:'控制台', idle:'空闲', unknown:'未知',
};
const MODE_LABEL = { task:'自动派发', manual:'手动对话', monitor:'监控页', other:'其他' };
const STATUS_CLASS = {running:'run',dispatched:'run',starting:'run',active:'run',queued:'',reported:'ok',done:'ok',blocked:'warn',failed:'bad',abandoned:'bad',interrupted:'bad',timeout:'bad',cancelled:'bad',paused:'warn',stalled:'warn',needs_owner:'warn',limit:'warn',error:'bad',stopped:'',killed:'bad',lost:'bad'};
const STAGE_CLASS = {generating:'run',sending:'run',tool_running:'run',waiting_confirm:'warn',rate_limited:'warn',auth_required:'bad',stale:'warn',dashboard:'ok',idle:'',waiting:''};
const STEPS = ['排队','发送','生成中','调工具','收尾'];
const AGENT_BACKENDS = ['claude','codex','web-chatgpt','web-gemini','gateway'];
const GEM_MODELS = [['','保持默认'],['4 Carbon','4 Carbon'],['4 Neon','4 Neon'],['4 Hydrogen','4 Hydrogen']];
const TEMPLATES = {
  '代码审查': '请审查当前工作目录最近的改动（先看 git status / git diff / git log），找出正确性问题、边界情况和可简化之处。\n按严重程度排序，每条给出 文件:行号、问题说明和修改建议。只汇报，不要直接改代码。',
  '实现功能并补单测': '请在当前项目中实现下面的功能，并补上对应的单元测试；跑通全部相关测试后，汇报改动的文件和测试结果。\n\n功能描述：\n',
  '阅读并解释项目': '请阅读当前工作目录的项目结构和关键源码，用中文说明：\n1. 这个项目做什么；\n2. 主要模块和数据流；\n3. 如何运行和测试；\n4. 值得注意的风险或技术债。\n只读不改。',
};

function trTool(name){ return TOOL_LABEL[name] || String(name || ''); }
function trStatus(st){ return STATUS_LABEL[st] || st || ''; }
function trStage(st){ return STAGE_LABEL[st] || st || ''; }
function trMode(m){ return MODE_LABEL[m] || m || ''; }
const TEST_RE = /^(smoke_|htest_|selftest-|oauth_check|accept_smoke|final_check|goal:selftest-)|dry-run|preflight|goal selftest|Use Local Projects MCP tools \(run_command/i;
function isTestTask(...vals){ return vals.some(v => { const s = String(v || ''); return TEST_RE.test(s) || /\bBENCH/.test(s); }); }
function isTestT(t){ return !!t && isTestTask(t.id, t.title, t.prompt_preview && t.prompt_preview.slice(0, 160), t.goal); }
function cleanTitle(s){
  s = String(s || '').replace(/\s+/g, ' ').trim();
  for (let i = 0; i < 3; i++) {
    const before = s;
    const r0 = s;
    s = s.replace(/^you are (?:the |an? )?\*\*[^*]{1,80}\*\*[\s,.:;—–-]*/i, '');
    if (s !== r0) s = s.replace(/^(?:for|of|on|in|at)\s+[^.。:：]{1,60}[.。:：]\s*/i, '');
    s = s.replace(/^you are (?:the |an? )?[\w -]{1,40}(?:agent|worker|reviewer|implementer|assistant)\b[\s,.:;—–-]*/i, '');
    s = s.replace(/^[#>*`_\s-]+/, '');
    if (s === before) break;
  }
  s = s.replace(/\*\*/g, '').replace(/`/g, '').trim();
  return s || '（未命名任务）';
}
function humanTitle(t){
  if (!t) return '';
  const s = String(t.title || '');
  if (s === 'Manual Gemini chat') return 'Gemini 手动对话';
  if (s === 'Manual ChatGPT chat') return 'ChatGPT 手动对话';
  if (/^Manual (.+) chat \(no task_id\)$/.test(s)) return s.replace(/^Manual (.+) chat \(no task_id\)$/, '$1 手动对话（未带编号）');
  if (/^Manual (.+) chat$/.test(s)) return s.replace(/^Manual (.+) chat$/, '$1 手动对话');
  if (s.startsWith('Ad-hoc ')) return '临时会话（' + s.slice(7) + '）';
  return cleanTitle(s || t.prompt_preview || t.id);
}

const OVERVIEW = '__overview__', COMPOSE = '__compose__', ACCOUNTS = '__accounts__', ALL = '__all__';
const VIEWS = [OVERVIEW, COMPOSE, ACCOUNTS, ALL];
const isView = (id) => VIEWS.includes(id);
function localStorageGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k,v){ try { localStorage.setItem(k,v); } catch {} }

const urlAcct = new URLSearchParams(location.search).get('account');
let state = null, sel = localStorageGet('gwm.sel') || OVERVIEW, taskFilter = 'all', taskQuery = '';
if (RO && sel === COMPOSE) sel = OVERVIEW;
let selectedAccount = urlAcct || localStorageGet('gwm.acct') || 'default', showAddAcct = false;
let hideTests = localStorageGet('gwm.hideTests') !== '0';
let showSysLogs = localStorageGet('gwm.showSys') === '1';
let feedQuery = '', feedLimit = 80, otherTabsOpen = false;
const openCalls = new Set();
const secOpen = { secPrompt:false, secFiles:false, secReports:true, secTl:true };
const model = {};
const fullTask = {};
let lastSeq = 0;
const secSig = {};

// ---------- theme ----------
function applyTheme(t){ document.documentElement.dataset.theme = t; $('#btnTheme').innerHTML = (t === 'dark' ? '☾' : '☀') + '<span class="m-hide">&nbsp;主题</span>'; }
applyTheme(localStorageGet('gwm.theme') === 'light' ? 'light' : 'dark');

if (RO) document.body.classList.add('ro');
$('#modeLbl').textContent = G.remote ? (G.readOnly ? '远程只读视图' : '远程视图（可审批）') : '本地管理（127.0.0.1）';
$('#chkHideTestsSide').checked = hideTests;

// ---------- event model (timeline) ----------
function tm(id){ return model[id] || (model[id] = { items: [], calls: new Map(), byJob: new Map() }); }
const seen = new Set();
function findJob(tid, job){ return tm(tid).byJob.get(job); }

function ingest(ev){
  if (seen.has(ev.seq)) return null;
  seen.add(ev.seq); lastSeq = Math.max(lastSeq, ev.seq);
  const changed = [];
  const add = (tid, item) => { if (tid) { tm(tid).items.push(item); changed.push(tid); } };
  const tid = ev.task_id;
  switch (ev.type) {
    case 'tool.start': {
      const c = { kind:'call', ev, end:null, out:'', diffs:[], jobs:[], confirm:null, conflict:null };
      if (tid) tm(tid).calls.set(ev.call_id, c);
      tm(ALL).calls.set(ev.call_id, c);
      add(tid, c); add(ALL, c); break;
    }
    case 'tool.end': { const c = (tid && tm(tid).calls.get(ev.call_id)) || tm(ALL).calls.get(ev.call_id); if (c) { c.end = ev; changed.push(tid, ALL); } break; }
    case 'tool.output': { const c = (tid && (tm(tid).calls.get(ev.call_id) || findJob(tid, ev.job_id))) || tm(ALL).calls.get(ev.call_id); if (c) { c.out += ev.chunk; if (c.out.length > 400000) c.out = c.out.slice(-300000); changed.push(tid, ALL); } break; }
    case 'job.start': { const c = tid && tm(tid).calls.get(ev.call_id); if (c) { c.jobs.push(ev); tm(tid).byJob.set(ev.job_id, c); changed.push(tid, ALL); } break; }
    case 'job.end': { const c = tid && tm(tid).byJob.get(ev.job_id); if (c) { c.jobEnd = ev; changed.push(tid, ALL); } break; }
    case 'file.changed': { const c = tid && tm(tid).calls.get(ev.call_id); if (c) { c.diffs.push(ev); changed.push(tid, ALL); } break; }
    case 'confirm.pending': { const c = tid && tm(tid).calls.get(ev.call_id); if (c) { c.confirm = { ...ev, state:'pending' }; changed.push(tid, ALL); } break; }
    case 'confirm.resolved': case 'confirm.late': { if (tid) for (const c of tm(tid).calls.values()) if (c.confirm && c.confirm.confirm_id === ev.confirm_id) { c.confirm.state = ev.approved ? '已批准' : (ev.how === 'timeout' ? '已超时' : '已拒绝'); c.confirm.how = ev.how || ev.by; } changed.push(tid, ALL); break; }
    case 'conflict': { const c = tid && tm(tid).calls.get(ev.call_id); if (c) c.conflict = ev; add(tid, { kind:'conflict', ev }); add(ALL, { kind:'conflict', ev }); break; }
    case 'report': add(tid, { kind:'report', ev }); add(ALL, { kind:'report', ev }); break;
    case 'task.created': case 'task.status': case 'task.queued': case 'task.slot': case 'task.slot_released': case 'task.stage': case 'driver.log':
      add(tid, { kind:'line', ev }); add(ALL, { kind:'line', ev }); break;
    default:
      if (ev.type.startsWith('goal.') || ev.type.startsWith('agent.') || ev.type.startsWith('safety.') || ev.type.startsWith('account.') || ev.type === 'confirm.auto' || ev.type === 'job.killed' || ev.type === 'web.limit' || ev.type === 'web.limit_cleared' || ev.type === 'dispatch.failed') {
        if (tid) add(tid, { kind:'line', ev });
        add(ALL, { kind:'line', ev });
      } else if (!tid) add(ALL, { kind:'line', ev });
  }
  return changed.filter(Boolean);
}

function isNoiseEvent(ev){
  if (!ev) return false;
  if (['mcp.request', 'task.stage', 'task.slot', 'task.slot_released', 'task.queued'].includes(ev.type)) return true;
  if (ev.type.startsWith('auth.') || ev.type.startsWith('server.')) return true;
  return false;
}
function keepInFeed(it, { allowSys = false, query = '' } = {}){
  const ev = it.ev;
  if (hideTests && isTestTask(ev.task_id, ev.title, ev.goal)) return false;
  if (!allowSys && it.kind === 'line' && isNoiseEvent(ev)) return false;
  if (query) {
    const hay = `${ev.task_id||''} ${ev.tool||''} ${ev.summary||''} ${ev.msg||''} ${ev.text||''} ${ev.title||''} ${ev.client||''} ${ev.path||''}`.toLowerCase();
    if (!hay.includes(query.toLowerCase())) return false;
  }
  return true;
}

function renderDiff(d){
  return '<div class="diff">' + String(d || '').split('\n').map(l => {
    const cls = l.startsWith('+++')||l.startsWith('---')||l.startsWith('===')||l.startsWith('Index:') ? 'f' : l.startsWith('@@') ? 'h' : l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : '';
    return `<div class="${cls}">${esc(l) || ' '}</div>`; }).join('') + '</div>';
}

function callHtml(c){
  const e = c.ev, end = c.end, tool = e.tool;
  const running = !end;
  const denied = end?.denied, err = end && !end.ok && !denied;
  let st = running ? '<span class="spin"></span>' : denied ? '<span class="st bad">已拒绝</span>' : err ? '<span class="st warn">报错</span>' : '<span class="st ok">✓</span>';
  if (c.confirm?.state === 'pending') st = '<span class="st warn">待确认</span>';
  const job = c.jobs[c.jobs.length-1];
  if (end?.running) st = '<span class="spin"></span><span class="st">后台运行</span>';
  const isSingle = !isView(sel);
  const isOpen = openCalls.has(e.call_id) || c.confirm?.state === 'pending';

  let body = '';
  if (denied) body += `<div class="reason">⛔ ${esc(end.reason || '操作被拒绝')}</div>`;
  if (c.confirm) {
    const p = c.confirm;
    body += `<div class="confirm"><div><b>高风险命令待审批</b> — ${esc((p.reasons||[]).join('、'))}</div><pre>${esc(p.command)}</pre><div class="meta">目录 ${esc(p.cwd)} · 状态：${esc(p.state)}${p.how? ' ('+esc(p.how)+')':''}</div>`
      + (p.state === 'pending' || p.state === '已超时' ? (G.readOnly ? '<div class="meta">请在本机控制台 (127.0.0.1) 进行审批</div>' : `<div class="btns"><button class="approve" data-confirm="${esc(p.confirm_id)}" data-ok="1">批准执行</button><button class="deny" data-confirm="${esc(p.confirm_id)}" data-ok="0">拒绝</button></div>`) : '')
      + '</div>';
  }
  if (tool === 'run_command' || tool === 'command_output') {
    const cmd = tool === 'run_command' ? `$ ${e.args?.command ?? ''}` : `… 任务 ${e.args?.job_id ?? ''}`;
    const fin = c.jobEnd;
    const exitLine = fin ? `<div class="exit ${fin.exit_code ? 'bad':''}">退出码 ${fin.exit_code ?? fin.signal}${fin.timed_out?' (超时终止)':''} · 耗时 ${fmtDur(fin.duration_ms)}</div>` : (job ? '<div class="exit">运行中…</div>' : '');
    if (!denied && (job || c.out || tool === 'run_command')) body += `<div class="term"><pre class="cmd">${esc(cmd)}</pre><pre style="color:#8b93a5">工作目录 ${esc(e.args?.cwd || '')}</pre><pre>${esc(c.out)}</pre>${exitLine}</div>`;
  }
  for (const d of c.diffs) body += `<div class="label" id="diff-${esc(d.call_id)}">${d.created ? '新建文件' : '修改文件'} ${esc(d.path)} <span class="badge ok">+${d.add}</span> <span class="badge bad">-${d.del}</span></div>${renderDiff(d.diff)}`;
  if (tool === 'edit_file' && end?.diff) body += `<div class="label">预演差异</div>${renderDiff(end.diff)}`;
  if (!['run_command','command_output'].includes(tool) && !c.diffs.length && end && !denied) body += `<div class="label">返回结果</div><pre>${esc(end.result_preview)}</pre>`;
  if (err && ['run_command','command_output'].includes(tool)) body += `<div class="label">报错信息</div><pre>${esc(end.result_preview)}</pre>`;
  body += `<details class="fold"><summary>查看调用参数</summary><pre>${esc(JSON.stringify(e.args, null, 2))}</pre></details>`;
  body += `<div class="meta" style="margin-top:6px">调用编号 ${esc(e.call_id)} · 会话 ${esc(e.task_id)} · 来源 ${esc(e.client||'未知')}</div>`;

  const cls = ['card', denied?'denied':'', err?'err':'', isOpen?'open':''].join(' ');
  const durTxt = end ? fmtDur(end.duration_ms) : '';
  const extra = end?.add != null ? ` <span class="badge ok">+${end.add}</span><span class="badge bad">-${end.del}</span>` : (end?.exit_code != null ? ` <span class="badge ${end.exit_code? 'bad':'ok'}">退出 ${end.exit_code}</span>` : '');
  const taskTag = !isSingle && e.task_id ? `<span class="badge click" data-task="${esc(e.task_id)}" title="查看所属会话">${esc(e.task_id)}</span>` : '';
  return `<div class="${cls}" data-call="${esc(e.call_id)}"><div class="ch"><span class="time">${hhmmss(e.ts)}</span><span>${ICON[tool]||'•'}</span><span class="tool">${esc(trTool(tool))}</span>${taskTag}<span class="sum">${esc(e.summary||'')}</span>${extra}<span class="dur">${durTxt}</span>${st}</div><div class="cb">${body}</div></div>`;
}

function lineHtml(ev){
  let txt = '';
  switch (ev.type) {
    case 'task.created': txt = `<b>新建任务</b>（来源：${esc(ev.from)}）— ${esc(cleanTitle(ev.title))}`; break;
    case 'task.status': txt = `状态变更为 <b>${esc(trStatus(ev.status))}</b>${ev.error ? ' · '+esc(ev.error) : ''}`; break;
    case 'task.stage': txt = `页面阶段 → <b>${esc(trStage(ev.stage))}</b>${ev.detail ? ' · '+esc(ev.detail) : ''}`; break;
    case 'task.queued': txt = `排队等待槽位（第 ${ev.position} 位，当前运行 ${ev.running}/${ev.limit}）`; break;
    case 'task.slot': txt = `获得并发槽位（当前运行 ${ev.running}/${ev.limit}）`; break;
    case 'task.slot_released': txt = `释放并发槽位`; break;
    case 'driver.log': txt = `<span class="badge ${ev.level==='error'?'bad':ev.level==='warn'?'warn':''}">浏览器驱动</span> ${esc(ev.msg)}`; break;
    case 'mcp.request': txt = `<span class="badge">连接事件</span> ${esc(ev.method)} · 客户端 <b>${esc(ev.client)}</b>${ev.client_info ? ' ('+esc(ev.client_info.name+' '+(ev.client_info.version||''))+')' : ''}`; break;
    case 'job.killed': txt = `<span class="badge warn">进程控制</span> 已强杀命令进程 ${esc(ev.job_id)}`; break;
    case 'web.limit': txt = `<span class="badge warn">触发限流</span> ${esc(ev.site)} [${esc(ev.account||'default')}] 暂停至 ${hhmmss(ev.until)}：${esc(ev.notice||'')}`; break;
    case 'web.limit_cleared': txt = `<span class="badge ok">解除限流</span> 已恢复派发`; break;
    case 'dispatch.failed': txt = `<span class="badge bad">派发失败</span> ${esc(SITE_NAME[ev.site] || ev.site)}：${esc(ev.error || '')}`; break;
    case 'account.saved': txt = `<span class="badge ok">账号管理</span> 已保存账号 <b>${esc(ev.account)}</b>`; break;
    case 'account.removed': txt = `<span class="badge warn">账号管理</span> 已移除账号 <b>${esc(ev.account)}</b>`; break;
    case 'account.default': txt = `<span class="badge ok">账号管理</span> 默认账号切换为 <b>${esc(ev.account)}</b>`; break;
    case 'account.toggled': txt = `<span class="badge">账号管理</span> ${esc(ev.account)} ${ev.enabled ? '已启用' : '已停用'}`; break;
    case 'server.start': txt = `<span class="badge">系统</span> 服务启动 v${esc(ev.version)} (PID ${esc(ev.pid)})`; break;
    case 'server.stop': txt = `<span class="badge">系统</span> 服务停止`; break;
    default:
      if (ev.type.startsWith('auth.')) txt = `<span class="badge ${ev.type.includes('reject')||ev.type.includes('unauth')?'warn':''}">鉴权</span> ${esc(ev.type.slice(5))} ${esc(ev.client_name||ev.client_id||'')} ${esc(ev.reason||'')}`;
      else if (ev.type.startsWith('safety.') || ev.type === 'confirm.auto') txt = `<span class="badge warn">${ev.type === 'confirm.auto' ? '安全快照放行' : '安全备份'}</span> ${esc(ev.text||ev.type)}`;
      else if (ev.type.startsWith('agent.')) txt = `<span class="badge ${ev.type==='agent.end'?(ev.status==='done'?'ok':'warn'):''}">本地代理</span> ${esc(ev.text||ev.type.slice(6))}`;
      else if (ev.type.startsWith('goal.')) txt = `<span class="badge">长周期目标</span> <b>${esc(ev.goal)}</b> ${esc(ev.text||ev.type.slice(5))}`;
      else txt = `${esc(ev.type)}`;
  }
  const tag = isView(sel) && ev.task_id ? `<span class="badge click" data-task="${esc(ev.task_id)}">${esc(ev.task_id)}</span>` : '';
  return `<div class="line"><span class="time">${hhmmss(ev.ts)}</span>${tag}<span>${txt}</span></div>`;
}

function reportHtml(ev){
  const icon = ev.status === 'final' ? '✅' : ev.status === 'blocked' ? '⚠️' : '📍';
  const kindTxt = ev.status === 'final' ? '最终汇报' : ev.status === 'blocked' ? '受阻汇报' : '阶段进度';
  const tag = isView(sel) && ev.task_id ? `<span class="badge click" data-task="${esc(ev.task_id)}">${esc(ev.task_id)}</span>` : '';
  return `<div class="report ${esc(ev.status)}"><div class="rh">${icon} ${kindTxt} <span class="dim mono" style="font-weight:400">${hhmmss(ev.ts || ev.at)}</span>${tag}</div><div><b>${esc(ev.summary)}</b></div>${ev.content ? `<div class="rc" style="margin-top:6px">${esc(ev.content)}</div>`:''}${ev.tests ? `<div class="label">测试与验证</div><pre>${esc(ev.tests)}</pre>`:''}${(ev.files_changed||[]).length ? `<div class="label">变更文件</div><pre>${esc(ev.files_changed.join('\n'))}</pre>`:''}</div>`;
}

function itemHtml(it){
  if (it.kind === 'call') return callHtml(it);
  if (it.kind === 'report') return reportHtml(it.ev);
  if (it.kind === 'conflict') return `<div class="conflict">⚠ 文件写冲突：<b>${esc(it.ev.path)}</b> — ${esc(it.ev.message)}${it.ev.other_task?`（占用任务 ${esc(it.ev.other_task)}）`:''}</div>`;
  return lineHtml(it.ev);
}

function siteBadge(site){
  if (site === 'chatgpt') return '<span class="badge gpt">ChatGPT</span>';
  if (site === 'gemini') return '<span class="badge gem">Gemini</span>';
  if (site === 'monitor') return '<span class="badge ok">控制台</span>';
  return `<span class="badge">${esc(site||'网页')}</span>`;
}
const SITE_NAME = { gemini:'Gemini', chatgpt:'ChatGPT' };

// ---------- derived state ----------
function isTaskActive(t){
  if (['queued','starting','dispatched','running'].includes(t.status)) return true;
  return t.status === 'active' && Date.now() - Date.parse(t.last_activity || t.created || 0) < 30 * 60 * 1000;
}
function inFlightFor(id){ return (state?.in_flight || []).filter(x => x.task_id === id); }
function liveWebTasks(){
  return (state?.tasks || []).filter(t => {
    if (t.origin === 'mcp') return t.status === 'active' && (inFlightFor(t.id).length > 0 || Date.now() - Date.parse(t.last_activity || t.created || 0) < 3 * 60 * 1000);
    return isTaskActive(t);
  });
}
function runningAgents(){
  if (Array.isArray(state?.agents?.active)) return state.agents.active;
  return (state?.agents?.recent || []).filter(a => a.status === 'running');
}
function stepOf(t){
  if (t.final) return 4;
  const s = t.driver?.stage;
  if (inFlightFor(t.id).length || s === 'tool_running' || s === 'waiting_confirm') return 3;
  if (s === 'generating' || s === 'waiting') return 2;
  if (s === 'sending') return 1;
  if (t.status === 'queued' || t.status === 'starting' || s === 'starting') return 0;
  if (t.status === 'dispatched') return 1;
  return 2;
}
function stepper(i){ return `<div class="stepper">${STEPS.map((s, k) => `<span class="stp ${k < i ? 'done' : k === i ? 'cur' : ''}"><i></i>${s}</span>`).join('')}</div>`; }
function tabFor(taskId){ return (state?.browser?.tabs || []).find(tb => tb.task_id === taskId); }
function siteQuota(site){
  const accts = (state?.accounts || []).filter(a => a.enabled && a.sites?.includes(site));
  const run = (state?.slots?.by_site?.[site]?.running || []).length;
  const lim = state?.slots?.by_site?.[site]?.limit ?? state?.slots?.limit ?? 3;
  const used = state?.web?.sites?.[site]?.used_today ?? 0;
  const capSum = accts.reduce((n, a) => n + (Number(a.quota?.[site]?.daily_limit ?? a.daily_limit) || 0), 0);
  const cap = capSum || state?.web?.daily_limit || '∞';
  const limited = accts.some(a => a.quota?.[site]?.limit) || !!state?.web?.sites?.[site]?.limit;
  return { run, lim, used, cap, limited };
}

function filteredTasks(){
  const q = taskQuery.trim().toLowerCase();
  return (state?.tasks || []).filter(t => {
    if (hideTests && isTestT(t)) return false;
    if (q && !`${t.id} ${t.title || ''} ${humanTitle(t)} ${t.from || ''}`.toLowerCase().includes(q)) return false;
    if (taskFilter === 'running') return isTaskActive(t);
    if (taskFilter === 'gemini') return (t.site || 'gemini') === 'gemini';
    if (taskFilter === 'chatgpt') return t.site === 'chatgpt';

function renderTasks(){

  const goals = (taskFilter === 'all' || taskFilter === 'running' ? (state.goals || []) : [])
    .filter(g => !hideTests || !isTestTask(g.id, g.name))

function setHtml(id, html){

  for (const el of $$('[data-since-ms]')) { const t = Number(el.dataset.sinceMs); if (t) el.textContent = fmtElapsed((now - t) / 1000); }
}

}

  if (czBusy || RO) return;

}

function taskSectionsHtml(t){

function renderMain(){

  if (sel === COMPOSE) { renderComposer(); return; }
  if (sel === ACCOUNTS) { mountAccounts(); updateAccounts(); return; }
  const main = $('#main');

    const filtered = tm(ALL).items.filter(it => keepInFeed(it, { allowSys: showSysLogs, query: feedQuery }));

    main.innerHTML = logsHeader() + '<div id="tl"></div>' + (filtered.length > feedLimit ? `<div class="more-wrap"><button class="btn" id="btnFeedMore">加载更早记录（还有 ${filtered.length - feedLimit} 条）</button></div>` : '');
    const tl = $('#tl');
    if (!shown.length) tl.innerHTML = '<div class="empty">当前筛选条件下暂无日志</div>';
    const frag = document.createDocumentFragment();
    for (const it of shown) frag.appendChild(mkEl(it));

    return;
  }
  const atBottom = isAtBottom();
  const items = tm(sel).items;
  const g = state?.goals?.find(x => x.id === sel);

  const head = g ? goalHeader(g) : t ? taskHeadHtml(t) : `<div class="dh"><h2>会话 ${esc(sel)}</h2></div>`;
  main.innerHTML = `<div id="dHead">${head}</div><div id="dSecs">${t ? taskSectionsHtml(t) : ''}</div>
    <details class="dsec tl" id="secTl" ${secOpen.secTl ? 'open' : ''}><summary>时间线 <span class="ct">${items.length}</span></summary><div id="tl"></div></details>`;
  secSig.dHead = head;

  if (!items.length) tl.innerHTML = '<div class="empty">该会话暂无操作记录</div>';
  const frag = document.createDocumentFragment();

  tick();
  if (atBottom) scrollBottom();
}
function refreshDetailHead(){
  if (isView(sel) || !$('#dHead')) return;
  const g = state?.goals?.find(x => x.id === sel);
  const t = state?.tasks?.find(x => x.id === sel);
  if (g) return setHtml('dHead', goalHeader(g));
  if (!t) return;
  setHtml('dHead', taskHeadHtml(t));
  setHtml('dSecs', taskSectionsHtml(t));
  const c = $('#secTl .ct'); if (c) c.textContent = tm(sel).items.length;
}
function mkEl(it){
  const d = document.createElement('div'); d.innerHTML = itemHtml(it); const el = d.firstElementChild || d; rendered.set(it, el); return el;
}
function refreshItem(it){
  const old = rendered.get(it); if (!old || !document.body.contains(old)) return;
  const atBottom = isAtBottom();
  const el = mkEl(it);
  const term = old.querySelector('.term'); const stick = term && term.scrollTop + term.clientHeight >= term.scrollHeight - 8;
  old.replaceWith(el);
  const nt = el.querySelector('.term'); if (nt) nt.scrollTop = stick || !term ? nt.scrollHeight : term.scrollTop;
  if (atBottom && sel !== ALL) scrollBottom();
}
function appendItem(it){
  const tl = $('#tl'); if (!tl) return;
  const e = tl.querySelector('.empty'); if (e) e.remove();
  if (sel === ALL) {
    if (!keepInFeed(it, { allowSys: showSysLogs, query: feedQuery })) return;
    tl.prepend(mkEl(it));
    return;
  }
  const atBottom = isAtBottom();
  tl.appendChild(mkEl(it));
  if (atBottom) scrollBottom();
}
const scroller = () => window.matchMedia('(max-width: 760px)').matches ? document.scrollingElement : $('#main');
function isAtBottom(){ const s = scroller(); return s.scrollHeight - s.scrollTop - s.clientHeight < 80; }
function scrollBottom(){ const s = scroller(); s.scrollTop = s.scrollHeight; }

// ---------- data ----------
async function apiPost(path, body = {}){
  try {
    const r = await fetch(G.api + path, { method:'POST', credentials:'same-origin', headers:{ 'content-type':'application/json', 'x-gwm-csrf': G.csrf }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && j?.error) toast(j.error, 'bad');
    return j;
  } catch (e) { toast('请求失败：' + (e.message || e), 'bad'); return {}; }
}
let stateBusy = false;
async function loadState(probe = false){
  if (stateBusy && !probe) return;
  stateBusy = true;
  try {
    const r = await fetch(G.api + '/state' + (probe ? '?probe=1' : ''), { credentials:'same-origin' });
    if (r.status === 401) { location.reload(); return; }
    const first = !state;
    state = await r.json();
    renderTop(); renderNav(); renderTasks();
    if (sel === OVERVIEW) updateOverview();
    else if (sel === ACCOUNTS) updateAccounts();
    else if (sel === COMPOSE) { if (first || !$('#czForm')) renderComposer(); else updateComposerMeta(); }
    else if (sel !== ALL) refreshDetailHead();
  } catch {} finally { stateBusy = false; }
}

let es, readyOnce = false, stTimer = null, ovTimer = null;
function scheduleState(){ if (!stTimer) stTimer = setTimeout(() => { stTimer = null; loadState(false); }, 300); }
function scheduleOverview(){ if (!ovTimer) ovTimer = setTimeout(() => { ovTimer = null; if (sel === OVERVIEW) updateOverview(); }, 250); }
function connect(){
  es = new EventSource(G.api + '/stream?backlog=4000' + (lastSeq ? '&since=' + lastSeq : ''));
  const live = $('#live');
  es.onopen = () => { live.innerHTML = '<span class="dot ok"></span><span class="lv-txt">实时</span>'; live.title = '实时事件流已连接'; };
  es.onerror = () => { live.innerHTML = '<span class="dot bad"></span><span class="lv-txt">重连中</span>'; live.title = '事件流断开，正在重连'; };
  es.addEventListener('ready', () => { readyOnce = true; renderTasks(); if (sel === OVERVIEW || sel === ALL || !isView(sel)) renderMain(); });
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (seen.has(ev.seq)) return;
    const before = isView(sel) ? null : new Set(tm(sel).items);
    const changed = ingest(ev);
    if (readyOnce && ev.type === 'dispatch.failed') toast(`派发失败：${ev.error || '未知错误'}`, 'bad');
    if (!readyOnce || !changed) return;
    if (/^(task\.|goal\.|confirm\.|tool\.|job\.|agent\.|account\.|web\.limit)/.test(ev.type) || ev.type === 'report') scheduleState();
    if (sel === OVERVIEW) { scheduleOverview(); return; }
    if (isView(sel) && sel !== ALL) return;
    if (!changed.includes(sel)) return;
    if (sel === ALL) { const last = tm(ALL).items[tm(ALL).items.length - 1]; if (last && last.ev === ev) appendItem(last); }
    else for (const it of tm(sel).items.slice(-5)) if (!before.has(it)) appendItem(it);
    const c = ev.call_id && tm(sel).calls.get(ev.call_id);
    if (c && rendered.has(c)) refreshItem(c);
  };
}

async function selectTask(id){
  if (RO && id === COMPOSE) id = OVERVIEW;
  sel = id; localStorageSet('gwm.sel', id);
  closeMenus();
  if (!isView(id) && !tm(id).loadedFull) {
    try {
      const r = await fetch(G.api + '/events?task_id=' + encodeURIComponent(id));
      const evs = await r.json();
      const m = tm(id); m.items = []; m.calls = new Map(); m.byJob = new Map();
      for (const ev of evs) { seen.delete(ev.seq); ingestOnly(ev); }
      m.loadedFull = true;
    } catch {}
  }
  if (!isView(id) && !G.remote && state?.tasks?.some(t => t.id === id) && !fullTask[id]) {
    fetch(G.api + '/tasks/' + encodeURIComponent(id)).then(r => r.ok ? r.json() : null).then(t => { if (t) { fullTask[id] = t; if (sel === id) refreshDetailHead(); } }).catch(() => {});
  }
  renderNav(); renderTasks(); renderMain();
  if (!isView(id)) scrollBottom();
  else { $('#main').scrollTop = 0; if (window.matchMedia('(max-width: 760px)').matches) window.scrollTo(0, 0); }
}
function ingestOnly(ev){
  const saveAll = model[ALL]; model[ALL] = { items: [], calls: new Map(), byJob: new Map() };
  ingest(ev); model[ALL] = saveAll;
}

  const d = e.target; if (!(d instanceof HTMLDetailsElement)) return;
  if (d.id === 'otherTabs') otherTabsOpen = d.open;
  else if (d.id in secOpen) secOpen[d.id] = d.open;
}, true);

document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'acctSelect') { selectedAccount = e.target.value; localStorageSet('gwm.acct', selectedAccount); }
  else if (id === 'chkHideTestsSide') {
    hideTests = !!e.target.checked; localStorageSet('gwm.hideTests', hideTests ? '1' : '0');
    renderTasks(); if (sel === OVERVIEW || sel === ALL) renderMain();
  } else if (id === 'chkSysLogs') { showSysLogs = !!e.target.checked; localStorageSet('gwm.showSys', showSysLogs ? '1' : '0'); renderMain(); }
  else if (id === 'czGemModel') { cz.gemModel = e.target.value; saveCz(); }
  else if (id === 'czGptModel') { cz.gptModel = e.target.value; saveCz(); renderComposer(); if (cz.gptModel === '__custom') $('#czGptCustom')?.focus(); }
  else if (id === 'czAllowPro') {
    if (e.target.checked && !confirm('允许使用 ChatGPT Pro 模型？这会消耗 Pro 额度，仅在确有需要时开启。')) { e.target.checked = false; return; }
    cz.allowPro = !!e.target.checked;
  }
  else if (id === 'czAccount') { cz.account = e.target.value; saveCz(); }
  else if (id === 'czRoot') { cz.root = e.target.value; saveCz(); }
});

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'feedSearch') {
    feedQuery = e.target.value || ''; feedLimit = 80; renderMain();
    const el = $('#feedSearch'); if (el) { el.focus(); el.setSelectionRange(feedQuery.length, feedQuery.length); }
  } else if (id === 'taskSearch') { taskQuery = e.target.value || ''; renderTasks(); }
  else if (id === 'czPrompt') { cz.prompt = e.target.value; saveCz(); }
  else if (id === 'czSub') { cz.sub = e.target.value; saveCz(); }
  else if (id === 'czChat') { cz.chat = e.target.value; saveCz(); }
  else if (id === 'czGptCustom') { cz.gptCustom = e.target.value; saveCz(); }
  else if (id === 'czTimeout') { cz.timeout = e.target.value; saveCz(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.closest?.('#czForm')) { e.preventDefault(); submitComposer(); }
  else if (e.key === 'Escape') closeMenus();
});

document.addEventListener('submit', async (e) => {
  if (e.target?.id === 'czForm') { e.preventDefault(); submitComposer(); return; }
  if (e.target?.id !== 'addAcctForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const sites = [];
  if (fd.get('gemini')) sites.push('gemini');
  if (fd.get('chatgpt')) sites.push('chatgpt');
  const res = await apiPost('/accounts', { name: fd.get('name'), label: fd.get('label') || undefined, sites });
  if (res.ok) {
    showAddAcct = false; selectedAccount = res.account?.name || selectedAccount; localStorageSet('gwm.acct', selectedAccount);
    toast(`已创建账号 ${res.account?.name}，端口 ${res.account?.port ?? ''}`, 'ok');
    if ($('#acctFormHost')) $('#acctFormHost').innerHTML = '';
    const tb = $('#btnToggleAddAcct'); if (tb) tb.textContent = '＋ 新增账号';
  }
  loadState(false);
});

const onScroll = () => { $('#jump').style.display = (isView(sel) || isAtBottom()) ? 'none' : 'block'; };
$('#main').addEventListener('scroll', onScroll); window.addEventListener('scroll', onScroll);
setInterval(() => loadState(false), 3000);
setInterval(tick, 1000);
setInterval(() => { if (state) renderTasks(); }, 30000); // keep relative times fresh
loadState(false).then(() => {
  if (!isView(sel) && !state?.tasks?.some(t => t.id === sel) && !state?.goals?.some(g => g.id === sel)) sel = OVERVIEW;
  renderNav(); renderTasks();
  if (isView(sel)) renderMain();
  connect();
  if (!isView(sel)) selectTask(sel);
});
</script>
</body>
</html>
